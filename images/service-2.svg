<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0d1f35"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dfcde"/>
      <stop offset="100%" stop-color="#4bb4ff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="120" fill="#2dfcde" opacity="0.12" filter="url(#blur)"/>
  <circle cx="1020" cy="110" r="120" fill="#4bb4ff" opacity="0.14" filter="url(#blur)"/>
  <circle cx="600" cy="640" r="180" fill="#2dfcde" opacity="0.08" filter="url(#blur)"/>
  <g opacity="0.08">
    <path d="M0 90 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M0 180 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M0 270 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M0 360 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M0 450 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M0 540 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M0 630 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M150 0 V700" stroke="#ffffff" stroke-width="1"/>
    <path d="M300 0 V700" stroke="#ffffff" stroke-width="1"/>
    <path d="M450 0 V700" stroke="#ffffff" stroke-width="1"/>
    <path d="M600 0 V700" stroke="#ffffff" stroke-width="1"/>
    <path d="M750 0 V700" stroke="#ffffff" stroke-width="1"/>
    <path d="M900 0 V700" stroke="#ffffff" stroke-width="1"/>
    <path d="M1050 0 V700" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="100" y="90" width="1000" height="520" rx="36" fill="#0a1527" stroke="#1d3b63" stroke-width="2"/>
    <rect x="450" y="210" width="240" height="180" rx="28" fill="#132844" stroke="url(#line)" stroke-width="3"/>
    <text x="570" y="285" fill="#eaf2ff" font-size="38" font-family="Arial" font-weight="700" text-anchor="middle">Fact</text>
    <text x="570" y="330" fill="#9ec9ff" font-size="24" font-family="Arial" text-anchor="middle">Orders / Revenue</text>

    <g fill="#10213a" stroke="#2dfcde" stroke-opacity="0.38" stroke-width="2">
      <rect x="160" y="160" width="180" height="110" rx="24"/>
      <rect x="160" y="350" width="180" height="110" rx="24"/>
      <rect x="800" y="160" width="180" height="110" rx="24"/>
      <rect x="800" y="350" width="180" height="110" rx="24"/>
    </g>
    <g fill="#eaf2ff" font-family="Arial" text-anchor="middle">
      <text x="250" y="220" font-size="30" font-weight="700">Dim Date</text>
      <text x="250" y="400" font-size="30" font-weight="700">Dim Product</text>
      <text x="890" y="220" font-size="30" font-weight="700">Dim Customer</text>
      <text x="890" y="400" font-size="30" font-weight="700">Dim Channel</text>
    </g>
    <g stroke="url(#line)" stroke-width="8" stroke-linecap="round">
      <path d="M340 215h110"/>
      <path d="M340 405h110"/>
      <path d="M690 215h110"/>
      <path d="M690 405h110"/>
    </g>
    <g fill="#2dfcde">
      <circle cx="450" cy="215" r="8"/><circle cx="450" cy="405" r="8"/>
      <circle cx="690" cy="215" r="8"/><circle cx="690" cy="405" r="8"/>
    </g>
  </g>

</svg>